name: Segurança
# Dependências com vulnerabilidade conhecida: bloqueia high/critical em produção e roda toda semana,
# porque um aviso novo pode surgir sem nenhuma mudança no código.
permissions:
  contents: read
on:
  pull_request:
    paths:
      ['**/package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/security.yml']
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
