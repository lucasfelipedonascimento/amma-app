# SÓ PARA DESENVOLVIMENTO LOCAL. Produção usa banco e Redis gerenciados, com senha própria e rede privada
# (ver docs/SEGURANCA.md). As portas abrem apenas em 127.0.0.1: nada aqui fica visível para a rede.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amma_dev}
      POSTGRES_DB: ${POSTGRES_DB:-amma}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5433}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
volumes:
  pgdata:
