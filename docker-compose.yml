services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amma_dev}
      POSTGRES_DB: ${POSTGRES_DB:-amma}
    ports: ['${POSTGRES_PORT:-5433}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
